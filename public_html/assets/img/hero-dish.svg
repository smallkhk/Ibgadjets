<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600" role="img" aria-label="Starlink dish on a rooftop at dusk">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#0d1b42"/>
      <stop offset="0.55" stop-color="#16265a"/>
      <stop offset="1" stop-color="#2a1f4d"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#39DFF2" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#39DFF2" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFB03D" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#FF3D8A" stop-opacity="0.12"/>
    </linearGradient>
    <linearGradient id="dish" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F2EEE4"/>
      <stop offset="1" stop-color="#93A3C9"/>
    </linearGradient>
    <radialGradient id="halo">
      <stop offset="0" stop-color="#39DFF2" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#39DFF2" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="800" height="600" fill="url(#sky)"/>
  <ellipse cx="640" cy="120" rx="300" ry="200" fill="url(#glow)"/>

  <g fill="#F2EEE4">
    <circle cx="80"  cy="70"  r="1.8" opacity=".9"/>
    <circle cx="180" cy="130" r="1.2" opacity=".6"/>
    <circle cx="300" cy="60"  r="2.1" opacity=".85"/>
    <circle cx="420" cy="150" r="1.3" opacity=".5"/>
    <circle cx="520" cy="48"  r="1.6" opacity=".75"/>
    <circle cx="700" cy="200" r="1.4" opacity=".6"/>
    <circle cx="130" cy="240" r="1.5" opacity=".5"/>
    <circle cx="620" cy="300" r="1.2" opacity=".4"/>
    <circle cx="255" cy="205" r="1.1" opacity=".45"/>
    <circle cx="745" cy="95"  r="1.9" opacity=".8"/>
  </g>

  <path d="M470 30 L620 -20 L700 400 L430 400 Z" fill="url(#beam)" opacity=".8"/>
  <circle cx="545" cy="400" r="150" fill="url(#halo)"/>

  <path d="M0 452 L120 452 L120 424 L250 424 L250 452 L800 452 L800 600 L0 600 Z" fill="#0A1430"/>
  <path d="M0 452 L800 452 L800 470 L0 470 Z" fill="#101E44"/>

  <g fill="#FFB03D" opacity=".85">
    <rect x="40"  y="492" width="26" height="20" rx="3"/>
    <rect x="96"  y="492" width="26" height="20" rx="3"/>
    <rect x="152" y="492" width="26" height="20" rx="3"/>
    <rect x="646" y="492" width="26" height="20" rx="3"/>
    <rect x="702" y="492" width="26" height="20" rx="3"/>
  </g>
  <g fill="#FF3D8A" opacity=".55">
    <rect x="40"  y="540" width="26" height="20" rx="3"/>
    <rect x="152" y="540" width="26" height="20" rx="3"/>
    <rect x="702" y="540" width="26" height="20" rx="3"/>
  </g>

  <g transform="translate(500 330) rotate(-18)">
    <rect x="38" y="72" width="10" height="66" rx="5" fill="#93A3C9"/>
    <rect x="18" y="132" width="52" height="10" rx="5" fill="#93A3C9"/>
    <ellipse cx="43" cy="42" rx="72" ry="44" fill="url(#dish)"/>
    <ellipse cx="43" cy="42" rx="72" ry="44" fill="none" stroke="#0A1430" stroke-opacity=".25" stroke-width="2"/>
    <ellipse cx="43" cy="38" rx="50" ry="29" fill="#0A1430" opacity=".18"/>
    <circle cx="43" cy="42" r="7" fill="#39DFF2"/>
  </g>
</svg>
